<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chat overlay</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 1rem;
        margin: 0;
      }
      .msg {
        padding: 0.25rem 0;
      }
      .user {
        font-weight: 600;
        color: #7cf;
      }
      .body p {
        display: inline;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="messages"></div>
    <script>
      const messages = document.getElementById("messages");
      const shown = new Set();
      function addMessage(message) {
        if (message.id && shown.has(message.id)) return;
        if (message.id) shown.add(message.id);
        const row = document.createElement("div");
        row.className = "msg";
        const sender = message.user?.displayName || message.senderName;
        if (sender) {
          const user = document.createElement("span");
          user.className = "user";
          user.textContent = `${sender}:`;
          row.append(user, " ");
        }
        const body = document.createElement("span");
        body.className = "body";
        // The host sanitizes broadcast/history bodies before exposing them.
        body.innerHTML = message.body;
        row.append(body);
      }

      fetch("./api/messages")
        .then((res) => res.json())
        .then(({ messages: history }) => history.forEach(addMessage));

      const events = new EventSource("./_sse/overlay");
      events.addEventListener("chat", (event) =>
        addMessage(JSON.parse(event.data)),
      );
    </script>
  </body>
</html>
