[package]
name = "hello-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The plugin *is* the module, so it builds as a wasm dynamic library.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde_json = "1"

# Keep the module small: this plugin ships as the whole artifact, with no
# shared engine to amortize its size against.
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
