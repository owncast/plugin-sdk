[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owncast-plugin-sdk"
version = "0.5.0"
description = "SDK and CLI for authoring Owncast plugins in Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Owncast" }]
keywords = ["owncast", "plugin", "wasm", "extism"]
# Pure stdlib at runtime; the wasm toolchain is fetched lazily by the CLI.
dependencies = []

[project.urls]
Homepage = "https://owncast.online"
Repository = "https://github.com/owncast/plugin-sdk"

[project.scripts]
owncast-plugin-py = "owncast_plugin.cli:main"

[tool.setuptools]
packages = ["owncast_plugin"]

# Ship the scaffolder's template tree (consumed by `owncast-plugin-py new`).
# Patterns are explicit so the dot-prefixed .agents/ tree is included too.
[tool.setuptools.package-data]
owncast_plugin = [
    "template/*",
    "template/src/*",
    "template/__tests__/*",
    "template/.agents/skills/create-owncast-plugin/*",
]
